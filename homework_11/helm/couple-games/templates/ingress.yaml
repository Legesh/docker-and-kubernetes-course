{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ default (printf "%s-ingress" (include "couple-games.fullname" .)) .Values.ingress.name }}
  labels:
    {{- include "couple-games.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.paths.apiPrefix | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.backend.servicePort }}
          - path: {{ .Values.ingress.paths.spaFallback | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: client
                port:
                  number: {{ .Values.client.servicePort }}
{{- end }}
